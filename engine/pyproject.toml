[project]
name = "engine"
version = "0.1.0"
description = "TradeDesk engine backend — Exness XAU/USD edition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
    # Exness data source: Yahoo Finance (GC=F tracks spot XAU/USD)
    "yfinance>=0.2.55",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

